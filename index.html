<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonder Words - Learn, Play, Sparkle</title>
  <meta name="theme-color" content="#fff3c4">
  <meta name="application-name" content="Wonder Words">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wonder Words">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #24324a;
      --muted: #65738d;
      --card: #ffffff;
      --line: #e5ebf6;
      --blue: #4d8cff;
      --blue-d: #2d69dd;
      --green: #32b67a;
      --green-d: #21925f;
      --red: #ff626b;
      --red-d: #d84851;
      --yellow: #ffd166;
      --purple: #8f7cff;
      --shadow: 0 10px 0 rgba(36,50,74,.06), 0 18px 42px rgba(36,50,74,.13);
      --radius: 28px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Comic Sans MS", "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      background: linear-gradient(150deg, #fff3c4, #dff4ff 55%, #ffe0ee);
      background-attachment: fixed;
      transition: background .35s ease;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .scene-decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .scene-decor span { position: absolute; opacity: .2; font-size: clamp(2.2rem, 8vw, 5rem); animation: floaty 7s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .scene-decor span:nth-child(1) { left: 3%; top: 12%; }
    .scene-decor span:nth-child(2) { right: 5%; top: 9%; }
    .scene-decor span:nth-child(3) { left: 7%; bottom: 13%; }
    .scene-decor span:nth-child(4) { right: 8%; bottom: 11%; }
    .scene-decor span:nth-child(5) { left: 48%; top: 3%; }
    @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(5deg); } }
    .app { position: relative; z-index: 1; width: min(1080px, 100%); margin: 0 auto; padding: 10px 12px 96px; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 0 0 14px; padding: 8px 10px;
      background: rgba(255,255,255,.82); backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,.9); border-radius: 24px; box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; color: var(--ink); padding: 2px; text-align: left; }
    .brand-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 16px; background: #fff3c4; font-size: 28px; }
    .brand strong { display: block; font-size: clamp(1.05rem, 2.4vw, 1.3rem); line-height: 1; }
    .brand small { display: block; color: var(--muted); font-size: .72rem; margin-top: 3px; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .star-pill { border: 0; border-radius: 999px; padding: 9px 14px; background: #fff4bf; color: #735000; font-weight: 900; font-size: 1.1rem; box-shadow: 0 4px 0 #f0d67d; white-space: nowrap; }
    .star-label { font-size: .8rem; font-weight: 700; }
    .header-avatar { width: 52px; height: 52px; border: 0; background: transparent; border-radius: 50%; padding: 0; flex: 0 0 auto; }
    .header-avatar .avatar-frame { width: 100%; height: 100%; border-width: 2px; }
    .parent-lock { border: 0; border-radius: 999px; background: #eef3ff; color: #40506c; padding: 10px 13px; font-weight: 800; box-shadow: 0 4px 0 #d6e1fa; white-space: nowrap; }
    .parent-lock span { font-size: .8rem; }
    .view { min-height: 70vh; }
    .home-hero {
      display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
      padding: 22px; border-radius: 32px; background: rgba(255,255,255,.9);
      box-shadow: var(--shadow); border: 4px solid rgba(255,255,255,.9);
    }
    .home-hero .avatar-frame { --av-size: 170px; }
    .hero-copy { flex: 1 1 260px; }
    .eyebrow { color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; }
    .hero-copy h2 { margin: 3px 0 5px; font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.05; }
    .hero-copy p { margin: 0 0 12px; color: var(--muted); font-size: 1.1rem; }
    .hero-stars { display: inline-flex; align-items: center; gap: 8px; background: #fff4bf; color: #735000; border-radius: 999px; padding: 10px 16px; font-size: 1.3rem; font-weight: 900; }
    .hero-stars small { font-size: .82rem; font-weight: 700; color: #8b6b24; }
    .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
    .game-card {
      position: relative; overflow: hidden; text-align: left; border: 4px solid rgba(255,255,255,.85);
      border-radius: 28px; min-height: 176px; padding: 18px; color: #fff;
      background: var(--accent); box-shadow: 0 9px 0 var(--accent-d), 0 18px 32px rgba(36,50,74,.13);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .game-card:hover { transform: translateY(-3px); }
    .game-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--accent-d); }
    .game-card::after { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -30px; bottom: -40px; background: rgba(255,255,255,.16); }
    .game-icon { display: block; font-size: 3rem; line-height: 1; margin-bottom: 8px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
    .game-card strong { display: block; font-size: 1.6rem; line-height: 1; }
    .game-card em { display: block; font-style: normal; margin-top: 6px; color: rgba(255,255,255,.9); font-size: .98rem; }
    .card-go { position: absolute; right: 16px; bottom: 13px; font-weight: 900; font-size: .9rem; }
    .activity { background: rgba(255,255,255,.95); border: 4px solid rgba(255,255,255,.9); border-radius: 32px; box-shadow: var(--shadow); padding: 18px; position: relative; overflow: hidden; }
    .activity-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 3px solid var(--line); padding-bottom: 12px; margin-bottom: 14px; }
    .activity-head h2 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); line-height: 1; }
    .activity-head p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
    .mini-stars { margin-left: auto; background: #fff4bf; color: #735000; border-radius: 999px; padding: 8px 14px; font-weight: 900; white-space: nowrap; }
    .activity-body { max-width: 760px; margin: 0 auto; text-align: center; }
    .big-word { font-size: clamp(3rem, 11vw, 5.8rem); line-height: 1; font-weight: 900; letter-spacing: .04em; margin: 8px 0 4px; text-transform: lowercase; }
    .picture { font-size: clamp(4.8rem, 14vw, 7.2rem); line-height: 1; margin: 8px 0; filter: drop-shadow(0 7px 0 rgba(36,50,74,.08)); }
    .hint { color: var(--muted); font-size: 1.1rem; margin: 0 0 10px; }
    .pill { display: inline-block; background: #f1f6ff; color: #36507a; border-radius: 999px; padding: 8px 14px; font-weight: 800; margin-bottom: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
    .btn {
      border: 0; border-radius: 18px; padding: 14px 18px; font-size: 1.08rem; font-weight: 900;
      color: #fff; background: var(--blue); box-shadow: 0 5px 0 var(--blue-d); min-height: 54px; min-width: 112px;
      transition: transform .12s, box-shadow .12s;
    }
    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-d); }
    .btn.green { background: var(--green); box-shadow: 0 5px 0 var(--green-d); }
    .btn.green:active { box-shadow: 0 2px 0 var(--green-d); }
    .btn.red { background: var(--red); box-shadow: 0 5px 0 var(--red-d); }
    .btn.red:active { box-shadow: 0 2px 0 var(--red-d); }
    .btn.soft { background: #eef3ff; color: var(--ink); box-shadow: 0 5px 0 #d4e0fa; }
    .btn.soft:active { box-shadow: 0 2px 0 #d4e0fa; }
    .btn.yellow { background: #ffc93c; color: #553b00; box-shadow: 0 5px 0 #d9a514; }
    .btn.small { padding: 9px 13px; font-size: .95rem; min-height: 42px; min-width: 0; border-radius: 14px; }
    .btn.wide { width: 100%; }
    .btn.locked { background: #e8edf7; color: #66738a; box-shadow: 0 5px 0 #d3dbeb; }
    .msg { min-height: 1.6em; font-size: 1.25rem; font-weight: 900; margin: 10px 0 6px; }
    .msg.good { color: var(--green-d); }
    .msg.bad { color: var(--red-d); }
    .msg.info { color: #47618c; }
    .slots, .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; min-height: 70px; }
    .slot, .tile { width: 62px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 2rem; font-weight: 900; text-transform: lowercase; user-select: none; }
    .slot { background: #f7faff; border: 3px dashed #c9d8f5; color: #9db2d8; }
    .slot.filled { border-style: solid; border-color: #9ec1ff; background: #eef5ff; color: var(--ink); }
    .slot.good { border-color: #73d2a3; background: #e8fbf1; color: #177a4c; }
    .slot.bad { border-color: #ff9b9f; background: #fff0f1; color: #c72f38; }
    .tile { border: 0; background: #fff; color: var(--ink); box-shadow: 0 5px 0 #dfe8fb; }
    .tile.used { opacity: .24; transform: scale(.95); box-shadow: none; }
    .choice-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 14px 0; }
    .choice-btn { min-width: 140px; min-height: 72px; }
    .target-letters, .type-slots { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin: 12px 0; }
    .target-letter { font-size: clamp(2.3rem, 9vw, 4.6rem); line-height: 1; font-weight: 900; text-shadow: 0 4px 0 rgba(36,50,74,.09); }
    .type-slot {
      width: 64px; height: 76px; border-radius: 18px; display: grid; place-items: center;
      font-size: 2.25rem; font-weight: 900; text-transform: lowercase;
      background: #f7faff; border: 3px dashed #c7d7f5; color: #99afd4;
    }
    .type-slot.ok { background: #e8fbf1; border: 3px solid #63cd99; color: #137a49; animation: pop .25s ease; }
    .type-slot.no { background: #fff0f1; border: 3px solid #ff858b; color: #c62e38; animation: shake .25s ease; }
    .onscreen { margin-top: 16px; padding: 12px; border-radius: 22px; background: #f2f6ff; border: 2px solid #dfe8fa; }
    .onscreen.hidden { display: none; }
    .kb-row { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; margin: 7px 0; }
    .key {
      min-width: 44px; height: 52px; padding: 0 10px; border: 0; border-radius: 12px;
      background: #fff; color: var(--ink); font-weight: 900; font-size: 1.12rem;
      box-shadow: 0 4px 0 #cbd8ef;
    }
    .key:active { transform: translateY(2px); box-shadow: 0 2px 0 #cbd8ef; }
    .key.wide { min-width: 100px; font-size: .9rem; background: #e6eeff; }
    .shop-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .shop-head h2 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .shop-balance { margin-left: auto; background: #fff4bf; color: #735000; border-radius: 999px; padding: 10px 16px; font-weight: 900; font-size: 1.18rem; }
    .shop-cats { display: flex; flex-wrap: wrap; gap: 9px; margin: 12px 0 16px; }
    .cat-pill { border: 0; border-radius: 999px; padding: 11px 16px; background: #eef3ff; color: #40506c; font-weight: 900; box-shadow: 0 4px 0 #d4e0fa; }
    .cat-pill.active { background: var(--purple); color: #fff; box-shadow: 0 4px 0 #6d59db; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }
    .shop-item {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: #fff; border: 3px solid var(--line); border-radius: 24px; padding: 14px;
      box-shadow: 0 6px 0 rgba(36,50,74,.05); position: relative;
    }
    .shop-item.owned { background: #f4fff9; border-color: #bcebd5; }
    .shop-item.using { border-color: #ffd166; box-shadow: 0 6px 0 #f2d27a; }
    .shop-art { height: 78px; display: grid; place-items: center; font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 5px 0 rgba(36,50,74,.07)); }
    .shop-name { font-size: 1.05rem; font-weight: 900; margin-top: 4px; }
    .shop-desc { color: var(--muted); font-size: .82rem; min-height: 2.4em; margin: 3px 0 8px; }
    .shop-price { color: #a86800; font-weight: 900; margin-bottom: 8px; }
    .shop-item .btn { width: 100%; }
    .profile-hero { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 18px; border-radius: 28px; background: #fff; box-shadow: var(--shadow); margin-bottom: 16px; }
    .profile-hero .avatar-frame { --av-size: 175px; }
    .profile-name { margin: 2px 0 4px; font-size: clamp(1.7rem, 5vw, 2.6rem); }
    .creator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .creator-card { background: #fff; border-radius: 24px; padding: 15px; box-shadow: 0 6px 0 rgba(36,50,74,.05); border: 3px solid var(--line); }
    .creator-card h3 { margin: 0 0 4px; font-size: 1.1rem; }
    .creator-card p { margin: 0 0 9px; color: var(--muted); font-size: .84rem; }
    .swatches, .option-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .swatch { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px #dce5f5; }
    .swatch.selected { box-shadow: 0 0 0 4px var(--ink); transform: scale(1.06); }
    .option-chip { border: 0; border-radius: 14px; padding: 9px 12px; background: #eef3ff; color: var(--ink); font-weight: 800; box-shadow: 0 3px 0 #d4e0fa; }
    .option-chip.selected { background: var(--purple); color: #fff; box-shadow: 0 3px 0 #6d59db; }
    .option-chip .opt-emoji { font-size: 1.3rem; margin-right: 3px; }
    .nickname-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .text-input { flex: 1 1 180px; border: 3px solid #dce6f8; border-radius: 16px; padding: 12px 14px; font-size: 1.08rem; min-width: 0; background: #fff; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 14px; background: rgba(28,38,64,.55); backdrop-filter: blur(4px); }
    .modal { width: min(780px, 100%); max-height: 90vh; overflow: auto; background: #fff; border-radius: 30px; padding: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
    .modal-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
    .modal-head h2 { margin: 0; font-size: 1.5rem; }
    .modal-close { border: 0; border-radius: 999px; width: 44px; height: 44px; background: #ffecee; color: #b7353d; font-weight: 900; font-size: 1.2rem; }
    .parent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .parent-box { background: #f7faff; border: 2px solid #e2eaf8; border-radius: 20px; padding: 14px; }
    .parent-box h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { background: #fff; border-radius: 14px; padding: 10px; }
    .stat b { display: block; font-size: 1.35rem; }
    .stat span { color: var(--muted); font-size: .78rem; }
    .field { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .field input { flex: 1 1 130px; border: 2px solid #dbe6fb; border-radius: 14px; padding: 10px 12px; min-width: 0; }
    .word-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 7px; max-height: 210px; overflow: auto; }
    .word-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 2px solid #e4ebf8; border-radius: 13px; padding: 7px 9px; font-weight: 800; }
    .xbtn { border: 0; background: #ffecee; color: #b7353d; border-radius: 10px; padding: 6px 9px; font-weight: 900; }
    .range-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
    .range-row input[type=range] { flex: 1; accent-color: var(--purple); }
    .range-row output { min-width: 46px; font-weight: 900; text-align: right; }
    .select { width: 100%; border: 2px solid #dbe6fb; border-radius: 14px; padding: 10px 12px; background: #fff; }
    .note { color: var(--muted); font-size: .86rem; margin: 6px 0 0; }
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 200; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; background: #24324a; color: #fff; border-radius: 999px; padding: 12px 20px; font-weight: 900; max-width: calc(100vw - 28px); text-align: center; box-shadow: 0 14px 40px rgba(0,0,0,.25); transition: .2s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.bad { background: #b7333d; }
    .fx { position: fixed; inset: 0; z-index: 150; pointer-events: none; overflow: hidden; }
    .confetti { position: absolute; top: -20px; width: 11px; height: 16px; border-radius: 3px; animation: fall 1.5s linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(660deg); opacity: .2; } }
    @keyframes pop { 0% { transform: scale(.8); } 65% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }
    .avatar-frame { width: var(--av-size, 120px); height: var(--av-size, 120px); border-radius: 50%; position: relative; overflow: hidden; display: grid; place-items: center; flex: 0 0 auto; border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(36,50,74,.08), 0 14px 28px rgba(36,50,74,.13); background: linear-gradient(180deg,#bdeaff,#fff0a8); }
    .avatar-frame svg { width: 100%; height: 100%; display: block; }
    .avatar-frame .animal-face { font-size: calc(var(--av-size, 120px) * .55); line-height: 1; filter: drop-shadow(0 5px 0 rgba(36,50,74,.1)); }
    .avatar-frame .avatar-hat { position: absolute; top: -3%; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: calc(var(--av-size, 120px) * .2); line-height: 1; filter: drop-shadow(0 3px 2px rgba(0,0,0,.2)); }
    .avatar-frame .avatar-accessory { position: absolute; font-size: calc(var(--av-size, 120px) * .18); line-height: 1; z-index: 3; }
    .avatar-frame .avatar-accessory.face { top: 42%; left: 50%; transform: translateX(-50%); }
    .avatar-frame .avatar-accessory.side { right: 1%; bottom: 10%; transform: rotate(12deg); }
    .avatar-frame .avatar-accessory.left { left: 0; bottom: 12%; transform: rotate(-10deg); }
    .avatar-frame .avatar-pet { position: absolute; right: 1%; bottom: 0; font-size: calc(var(--av-size, 120px) * .22); line-height: 1; filter: drop-shadow(0 2px 1px rgba(0,0,0,.2)); }
    .avatar-frame .avatar-badge { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); font-size: calc(var(--av-size, 120px) * .14); line-height: 1; background: rgba(255,255,255,.85); border-radius: 999px; padding: .12em .3em; }
    .avatar-frame.mini .avatar-badge { display: none; }
    .avatar-frame.mini .avatar-pet { right: -2px; bottom: -2px; font-size: 15px; }
    .avatar-frame.mini .avatar-hat { top: -1%; }
    .avatar-frame.theme-space { background: radial-gradient(circle at 30% 25%, #5367c9, #171b48 70%); }
    .avatar-frame.theme-jungle { background: linear-gradient(180deg,#94e3ae,#1f7b51); }
    .avatar-frame.theme-ocean { background: linear-gradient(180deg,#9fe9ff,#1673a8); }
    .avatar-frame.theme-candy { background: linear-gradient(180deg,#ffd1ea,#ff8ac2); }
    .avatar-frame.theme-rainbow { background: linear-gradient(135deg,#ffadad,#ffd6a5,#fdffb6,#a0e7e5,#b4a7ff,#ffb7e5); }
    .avatar-frame.theme-night { background: linear-gradient(180deg,#28306b,#0f1336); }
    body[data-theme="sunny"] { background: linear-gradient(150deg,#fff3c4,#dff4ff 55%,#ffe0ee); }
    body[data-theme="space"] { background: radial-gradient(circle at 20% 15%, #3a449a 0 8%, transparent 8.5%), radial-gradient(circle at 80% 70%, #44318a 0 12%, transparent 12.5%), linear-gradient(145deg,#0b1030,#1b245e 60%,#111638); }
    body[data-theme="jungle"] { background: radial-gradient(circle at 15% 20%, #9be7b1 0 10%, transparent 10.5%), radial-gradient(circle at 85% 80%, #4bb67b 0 13%, transparent 13.5%), linear-gradient(145deg,#d8f8dc,#7ed5a8 55%,#25815b); }
    body[data-theme="ocean"] { background: radial-gradient(circle at 20% 15%, #b9f0ff 0 9%, transparent 9.5%), radial-gradient(circle at 80% 80%, #70d5ff 0 12%, transparent 12.5%), linear-gradient(145deg,#d9f7ff,#78d3f8 55%,#1f7fba); }

    /* Playful mini-game arcade */

      width:clamp(122px,27vw,172px); height:clamp(122px,27vw,172px);
      margin:10px auto 6px; border-radius:50%;
      background:radial-gradient(circle at 33% 27%,#fff 0 18%,#eef8ff 52%,#d9edff 100%);

    .picture::before { content:"✨"; position:absolute; top:5%; right:8%; font-size:.32em; animation:twinkle 2.2s ease-in-out infinite; }
    .picture::after { content:"⭐"; position:absolute; bottom:7%; left:8%; font-size:.24em; opacity:.85; animation:twinkle 2.7s .45s ease-in-out infinite; }
